specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: SmartData
providerId: smart-data
publisherName: SmartData (National Drones)
serviceCategory: SaaS
generated: '2026-08-14'
method: derived
source: plans/smart-data-plans-pricing.yml
created: '2026-05-04'
modified: '2026-08-14'
# 2026-08-14: the 2026-05-04 bulk-sweep version of this file described a USD,
# usage-based, per-API-request billing model with api_requests / data_egress /
# compute_seconds meters and three invented API products. None of that is SmartData's
# billing model. Rebuilt from the provider's published BYO Data Hosting pricing:
# AUD subscriptions metered by hosted dataset count and seats, with storage as a
# stated fair-use allowance and manual overage review.
tags:
  - Drone Data
  - Data Hosting
  - Geospatial
  - FinOps
  - Cost Management
  - FOCUS
description: >-
  FOCUS-aligned cost mapping for SmartData, derived from the provider's published
  subscription pricing. SmartData bills a recurring SaaS subscription in Australian
  dollars, priced by the number of hosted drone datasets a team keeps active and the
  number of seats, not by API consumption. There is no metered API charge because
  there is no public API.
billingModel:
  pricingCategory: Committed subscription
  billingFrequency: Annual (Dataset Pass, Starter) and Monthly (Pro)
  billingCurrency: AUD
  chargeCategories:
    - Purchase
  chargeFrequency: Recurring
  selfServiceCheckout: true
  enterpriseMotion: contact-led
  overagePolicy: >-
    Provider states storage is a fair-use infrastructure allowance and that overage is
    reviewed manually for the MVP rather than charged through automatic overage billing.
focusColumns:
  ServiceName: SmartData
  ServiceCategory: Analytics
  ProviderName: SmartData
  PublisherName: National Drones
  InvoiceIssuerName: National Drones
  PricingCategory: Committed
  PricingUnit: hosted dataset
  BillingCurrency: AUD
  ChargeCategory: Purchase
meters:
  - name: hosted_datasets
    description: >-
      Count of processed, viewer-ready drone datasets kept active in the SmartData
      workspace. This is the provider's stated primary customer-facing limit.
    unit: dataset
    aggregation: max
    billable: true
    dimensions:
      - plan
      - workspace
  - name: seats
    description: Named users with access to the SmartData workspace.
    unit: user
    aggregation: max
    billable: true
    dimensions:
      - plan
      - workspace
  - name: included_storage
    description: >-
      Storage consumed by hosted dataset packages. Included in the plan as a fair-use
      allowance; not billed as a metered unit.
    unit: GB
    aggregation: max
    billable: false
    dimensions:
      - plan
      - workspace
outOfScopeCharges:
  - name: Conversion and processing
    description: >-
      Raw DJI/Agisoft project folders, raw photos, loose GeoTIFF, loose LAS/LAZ and
      loose OBJ/FBX files are not direct BYO uploads and are quoted separately as
      conversion or processing work.
    pricing: quoted
unitEconomics:
  - name: Cost per hosted dataset per year
    metric: annualised_plan_price / hosted_datasets
    values:
      - plan: BYO Dataset Pass
        value: 'AUD 149.00'
      - plan: BYO Starter
        value: 'AUD 83.00'
      - plan: BYO Pro
        value: 'AUD 199.20'
    note: >-
      Derived arithmetic from the provider's published prices and dataset allowances
      (Pro annualised at 249 x 12 / 15). Not a price SmartData publishes.
  - name: Cost per seat per year
    metric: annualised_plan_price / seats
    values:
      - plan: BYO Dataset Pass
        value: 'AUD 74.50'
      - plan: BYO Starter
        value: 'AUD 49.80'
      - plan: BYO Pro
        value: 'AUD 298.80'
    note: Derived arithmetic from published prices and seat counts.
maintainers:
