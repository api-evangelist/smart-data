description: >-
  SmartData publishes no API rate limits because it publishes no public API. The
  SmartData product is an end-user web workspace for hosting and reviewing processed
  drone datasets; its only machine surface is the session-authenticated backend the
  application itself calls at https://app.ndsmartdata.com/api/v1/, which is not
  documented, not marketed, and returns HTTP 403
  {"detail":"Authentication credentials were not provided."} to anonymous callers.
  The customer-facing meters SmartData does publish are commercial, not runtime -
  hosted dataset count, seats, and a fair-use storage allowance - and those are
  captured in plans/smart-data-plans-pricing.yml. No documented quota, burst,
  window, Retry-After behaviour or RateLimit-* response header could be found on
  any SmartData or National Drones page.
notes:
