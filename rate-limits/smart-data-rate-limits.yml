# 2026-08-14: this file previously held fabricated per-minute/per-month request limits
# and an X-RateLimit-* header set written by the 2026-05-04 bulk sweep. SmartData
# publishes no API and therefore no rate limits; every value in that scaffold was
# invented. Replaced with an honest zero.
