aid: smart-data
name: SmartData
description: >-
  SmartData is a hosted drone-data workspace built and operated by National Drones, a
  CASA ReOC holder and Registered Training Organisation headquartered at Level 34,
  1 Eagle Street, Brisbane, Australia. Teams bring processed, viewer-ready outputs from
  DJI Terra, Agisoft Metashape or their own photogrammetry workflow into SmartData and
  share one secure browser workspace where clients and asset owners can inspect,
  measure, compare and sign off on the data instead of passing files around. The
  platform hosts orthomosaic views, Cesium 3D Tiles, tiled point clouds and Gaussian
  Splat packages, layers AI-assisted inspection review, measurements, change detection,
  reporting and role-based team governance over them, and is expanding into processing
  and analytics workflows for DJI L3 LiDAR, Elios confined-space data, powerline
  corridor analytics and forestry intelligence. It serves power and utilities,
  telecommunications, mining and resources, forestry and environment, and
  infrastructure and construction. SmartData is sold as an end-user SaaS product: it
  publishes pricing, a public demo sandbox and self-service signup, but no API,
  developer portal, SDK, webhook surface or machine-readable contract of any kind.
