x-provenance-note: >-
  2026-08-14 correction. Until this pass, this profile described a fictional company:
  "Smart Data", a data enrichment / integration / data quality API vendor, with three
  invented APIs (Smart Data Enrichment API, Smart Data Integration API, Smart Data
  Quality API) each pointing at a Documentation URL under www.smart-data.com/docs/ that
  has never existed and returns 404. The fabricated identity also drove fabricated
  plans, rate-limit and FinOps artifacts. smart-data.com is in fact SmartData, National
  Drones' drone-data hosting and inspection platform in Brisbane, Australia. The
  invented APIs and their dead documentation pointers have been removed, the identity
  and description rebuilt from the provider's own pages, and the plans/rate-limits/
  finops artifacts replaced with the provider's published pricing and an honest zero
  for rate limits. The three blog posts already in blogs/ were correctly harvested from
  the real company's former WordPress site and are unaffected.
