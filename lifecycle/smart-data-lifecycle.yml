  note: >-
    No versioning policy is published. The application's own backend is path-versioned
    (https://app.ndsmartdata.com/api/v1/) but that surface is undocumented, unmarketed
    and session-authenticated, so the v1 prefix is an implementation detail rather than
    a public contract commitment.
