status_page:
  published: false
  url: https://status.ndsmartdata.com/
  http_status: 200
  provider: StatusCake
  timezone: Australia/Brisbane
  note: >-
    IMPORTANT - this is a 200 that carries no information. The subdomain is a
    provisioned StatusCake public report, but the report data endpoint
    (https://app.statuscake.com/Workfloor/PublicReportHandler.php?PublicID=status.ndsmartdata.com)
    returns {"Title":null,"Announce":null,"TestData":[]} - zero monitored tests, no
    title, no announcements. The page renders as "Loading..." with an empty uptime
    table. It is a configured shell, not a published status page, so NO StatusPage
    pointer is wired into apis.yml. Recording the 200 without this check would have
    credited SmartData with an operational surface it does not actually operate.
    If National Drones adds monitors to this report it becomes a real status page and
    should be re-probed.
